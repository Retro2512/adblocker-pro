<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adblocker Pro</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main>
    <header class="brand-row">
      <a class="brand" href="options.html" id="brand-link"><img src="../icons/icon32.png" width="28" height="28" alt=""><span>Adblocker Pro</span></a>
      <label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="Enable Adblocker Pro" disabled><span class="switch-track" aria-hidden="true"></span></label>
    </header>
    <section class="track" aria-labelledby="track-title">
      <p class="state" id="state" data-tone="neutral">Connecting</p>
      <h1 id="track-title">No track detected</h1>
      <p class="artist" id="track-artist"></p>
      <p class="site" id="track-site"></p>
    </section>
    <div class="track-actions">
      <button id="allow-track" class="button primary" disabled>Allow track</button>
      <button id="block-track" class="button" disabled>Block track</button>
    </div>
    <footer class="popup-footer"><p id="feedback" class="feedback" role="status" aria-live="polite"></p><a id="settings-link" href="options.html">Settings <span aria-hidden="true">↗</span></a></footer>
  </main>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
