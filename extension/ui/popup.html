<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adblocker Pro</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main>
    <header class="brand-row">
      <div class="brand"><img src="../icons/icon32.png" width="28" height="28" alt=""><span>Adblocker Pro</span></div>
      <label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="Enable Adblocker Pro" disabled><span class="switch-track" aria-hidden="true"></span></label>
    </header>
    <section class="counter" aria-labelledby="blocked-label">
      <p id="blocked-label">Blocked</p>
      <output id="blocked-count" aria-live="polite">…</output>
    </section>
    <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
